services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: env
    ports:
      - "5432:5432"
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=inq6mth
      - POSTGRES_DB=columntest
  web:
    build: .
    command: python3 app.py
    env_file: env
    volumes:
      - .:/code
    ports:
      - "5000:5000"
    depends_on:
      - db
  redis:
    image: redis:7
